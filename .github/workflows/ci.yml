name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: wayfinder
          POSTGRES_PASSWORD: wayfinder
          POSTGRES_DB: wayfinder
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wayfinder" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Every suite must pass and coverage must stay above the floors in vitest.config.ts and
      # apps/mobile/jest.config.js (docs/testing.md).
      - name: Vitest (unit, web, integration on real Postgres) with coverage floors
        run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgres://wayfinder:wayfinder@localhost:5432/wayfinder
      - name: Android tests with coverage floors
        run: pnpm test:mobile:coverage
      - name: Build server packages and web
        run: pnpm -r --filter "./packages/*" --filter @wayfinder/api --filter @wayfinder/worker --filter @wayfinder/web build
      - name: Android JS bundle
        run: pnpm --filter @wayfinder/mobile exec expo export --platform android --output-dir dist-check
        env:
          CI: '1'

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        run: pnpm --filter @wayfinder/mobile exec expo prebuild --platform android --clean
        env:
          CI: '1'
      - name: Android Auto module tests (Robolectric)
        working-directory: apps/mobile/android
        run: ./gradlew :wayfinder-car:testDebugUnitTest

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wayfinder/web exec playwright install --with-deps chromium
      - name: Playwright (PGlite + fake routing engine)
        run: pnpm --filter @wayfinder/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
