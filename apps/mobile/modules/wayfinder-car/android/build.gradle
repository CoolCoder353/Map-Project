plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'jacoco'
}

group = 'app.wayfinder.car'
version = '0.1.0'

// The car library and its test harness must be the same version.
def carAppVersion = '1.7.0'
// Must equal org.maplibre.reactnative.nativeVersion in @maplibre/maplibre-react-native
// (apps/mobile/test/carModule.test.ts checks), so the phone and car maps share one engine.
def maplibreVersion = '13.2.0'

android {
  namespace 'app.wayfinder.car'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        // Robolectric loads classes through its own loader; without these JaCoCo sees none of them.
        jacoco {
          includeNoLocationClasses = true
          excludes = ['jdk.internal.*']
        }
      }
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation "androidx.car.app:app:$carAppVersion"
  implementation "org.maplibre.gl:android-sdk-opengl:$maplibreVersion"

  testImplementation "androidx.car.app:app-testing:$carAppVersion"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
  testImplementation 'androidx.test:core:1.6.1'
}

// Coverage of the car module's own code by its unit tests (docs/testing.md#android-auto-coverage).
// Run after testDebugUnitTest by infra/scripts/test-android-native.sh.
def carClasses = fileTree("$buildDir/tmp/kotlin-classes/debug") {
  exclude '**/R.class', '**/R$*.class', '**/BuildConfig.*',
          // The thin glue that boots React Native in the car process: needs a real React runtime.
          '**/bridge/ReactBoot*'
}

tasks.register('jacocoCarCoverageReport', JacocoReport) {
  dependsOn 'testDebugUnitTest'
  classDirectories.setFrom(carClasses)
  sourceDirectories.setFrom(files('src/main/java'))
  executionData.setFrom(fileTree(buildDir) { include 'jacoco/testDebugUnitTest.exec' })
  reports {
    html.required = true
    xml.required = true
  }
}

tasks.register('jacocoCarCoverageVerification', JacocoCoverageVerification) {
  dependsOn 'jacocoCarCoverageReport'
  classDirectories.setFrom(carClasses)
  executionData.setFrom(fileTree(buildDir) { include 'jacoco/testDebugUnitTest.exec' })
  violationRules {
    rule {
      limit {
        counter = 'LINE'
        minimum = 0.72
      }
      limit {
        counter = 'BRANCH'
        minimum = 0.65
      }
    }
  }
}
