# GraphHopper 11 configuration for Wayfinder (Australia, car + foot).
graphhopper:
  datareader.file: ""
  graph.location: /data/graphhopper/graph-current
  custom_models.directory: /opt/graphhopper/custom_models

  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]
    - name: foot
      custom_model_files: [wf_foot.json]

  # Fastest routes use CH; explore requests carry a custom model (visited-area penalty),
  # which needs the flexible algorithms, sped up by landmarks (LM).
  profiles_ch:
    - profile: car
    - profile: foot
  profiles_lm:
    - profile: car
    - profile: foot

  # osm_way_id: which OSM way each metre of a route belongs to — the unit of road coverage.
  # Unlike internal edge ids it survives a graph rebuild.
  graph.encoded_values: osm_way_id, car_access, car_average_speed, road_access, max_speed, road_class, road_environment, foot_access, foot_priority, foot_average_speed, foot_road_access, hike_rating, mtb_rating, country
  import.osm.ignored_highways: construction,proposed,abandoned,razed
  prepare.min_network_size: 200
  prepare.lm.landmarks: 16
  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.non_ch.max_waypoint_distance: 1000000
  routing.max_visited_nodes: 3000000
  routing.timeout_ms: 20000
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: localhost

logging:
  level: INFO
  appenders:
    - type: console
      time_zone: UTC
